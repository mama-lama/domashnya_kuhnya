services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homekitchen-app
    restart: always
    working_dir: /var/www
    environment:
      LOG_CHANNEL: stderr
      LOG_STACK: stderr
    volumes:
      - .:/var/www
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: homekitchen-web
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    command: --lower_case_table_names=2
    container_name: homekitchen-db
    restart: always
    environment:
      MYSQL_DATABASE: homekitchen
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_password
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql_data:/var/lib/mysql
